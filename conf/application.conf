# Play application secret — override with APPLICATION_SECRET env var in any real deployment
play.http.secret.key = "changeme-local-dev-only-not-for-production-use-please-generate-a-real-secret"
play.http.secret.key =  ${?APPLICATION_SECRET}
play.filters.hosts.allowed = ["localhost", ".local", "bokun-production.up.railway.app"]


# --- MySQL ---
db.default.driver = "com.mysql.cj.jdbc.Driver"
# connectTimeout/socketTimeout bound how long a hung MySQL connection can stall a request.
db.default.url = "jdbc:mysql://127.0.0.1:3306/bokun_links?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=1000&socketTimeout=2000"
db.default.url = ${?MYSQL_URL}
db.default.username = "root"
db.default.username = ${?MYSQL_USER}
db.default.password = ""
db.default.password = ${?MYSQL_PASSWORD}
db.default.hikaricp.connectionTimeout = 2000

play.evolutions.db.default.autoApply = true

# --- Redis ---
redis.host = "localhost"
redis.host = ${?REDIS_HOST}
redis.port = 6379
redis.port = ${?REDIS_PORT}
# TTL, not permanent, bounds Redis memory growth. MySQL stays the durable copy either way.
redis.linkTtlSeconds = 2592000
redis.linkTtlSeconds = ${?REDIS_LINK_TTL_SECONDS}


# --- Errors ---
play.http.errorHandler = "errors.LinkServiceErrorHandler"

# --- AWS SQS ---
aws.region = "eu-west-1"
aws.region = ${?AWS_REGION}
aws.sqs.queueUrl = "http://localhost:4566/000000000000/click-events"
aws.sqs.queueUrl = ${?SQS_QUEUE_URL}
# Blank by default (real AWS). Only set for local dev to redirect the client at LocalStack.
aws.sqs.endpointOverride = ""
aws.sqs.endpointOverride = ${?SQS_ENDPOINT_OVERRIDE}

# --- Service ---
# Base URL used when generating managed redirect links, e.g. https://links.bokun.io
service.baseUrl = "http://localhost:9000"
service.baseUrl = ${?SERVICE_BASE_URL}
